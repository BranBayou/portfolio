<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevPort | Senior Frontend Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              dev: {
                bg: '#0d1117',
                panel: '#161b22',
                border: '#30363d',
                blue: '#58a6ff',
                green: '#3fb950',
                purple: '#bc8cff',
                orange: '#d29922',
                red: '#ff7b72',
                text: '#c9d1d9',
                muted: '#8b949e'
              }
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'flash': 'flash 1s ease-out',
            },
            keyframes: {
              flash: {
                '0%': { backgroundColor: 'rgba(188, 140, 255, 0.4)' },
                '100%': { backgroundColor: 'transparent' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Custom scrollbar to match DevTools aesthetic */
      ::-webkit-scrollbar {
        width: 10px;
        background: #0d1117;
      }
      ::-webkit-scrollbar-thumb {
        background: #30363d;
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #8b949e;
      }
      body {
        background-color: #0d1117;
        color: #c9d1d9;
      }
    </style>

    "three": "https://aistudiocdn.com/three@^0.181.2",
    "animejs": "https://aistudiocdn.com/animejs@^3.2.2"
  }
}
</script>
